<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GDG API Editor</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="./script.js" defer></script>
</head>
<body>

  <!-- AUTH WRAPPER -->
  <div id="auth-wrapper">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="auth-screen">
      <img src="./img/gdg.webp" alt="GDG" class="auth-logo" />
      <h1>GDG API Editor</h1>
      <p class="auth-sub">GD Gamers Iceberg - made by xhvsh</p>

      <div class="auth-card">
        <h2>Login</h2>

        <label for="login-username">Username</label>
        <input type="text" id="login-username" placeholder="Enter username" autocomplete="username" />

        <label for="login-password">Password</label>
        <div class="password-wrap">
          <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password" />
          <button class="toggle-pw" data-target="login-password">👁</button>
        </div>

        <label class="remember-label">
          <input type="checkbox" id="remember-me" />
          Remember on this browser
        </label>

        <button class="btn-primary" id="login-btn">Login</button>
        <p class="auth-switch">Don't have an account? <a href="#" id="go-register">Register</a></p>
      </div>
    </div>

    <!-- REGISTER SCREEN -->
    <div id="register-screen" class="auth-screen hidden">
      <img src="./img/gdg.webp" alt="GDG" class="auth-logo" />
      <h1>GDG API Editor</h1>
      <p class="auth-sub">GD Gamers Iceberg - made by xhvsh</p>

      <div class="auth-card">
        <h2>Register</h2>

        <label for="reg-username">Username</label>
        <input type="text" id="reg-username" placeholder="Choose a username" autocomplete="username" />

        <label for="reg-password">Password</label>
        <div class="password-wrap">
          <input type="password" id="reg-password" placeholder="Choose a password" autocomplete="new-password" />
          <button class="toggle-pw" data-target="reg-password">👁</button>
        </div>

        <label for="reg-repeat">Repeat Password</label>
        <div class="password-wrap">
          <input type="password" id="reg-repeat" placeholder="Repeat password" autocomplete="new-password" />
          <button class="toggle-pw" data-target="reg-repeat">👁</button>
        </div>

        <label for="reg-code">Access Code</label>
        <input type="text" id="reg-code" placeholder="Enter access code" />

        <button class="btn-primary" id="register-btn">Register</button>
        <p class="auth-switch">Already have an account? <a href="#" id="go-login">Login</a></p>
      </div>
    </div>

  </div>

  <!-- MAIN APP (hidden until logged in) -->
  <div id="app" class="hidden">
    <header>
      <img src="./img/gdg.webp" alt="GDG" class="header-logo" />
      <div class="header-info">
        <h2>GDG API Editor</h2>
        <span class="status-badge" id="status-badge">Live</span>
        <div id="unsaved-dot" title="Unsaved changes"></div>
      </div>
      <div class="header-welcome">
        Welcome, <span id="welcome-username"></span>
      </div>
      <div class="header-right">
        <span id="logged-in-user" class="username-display"></span>
        <button id="logout-btn">Logout</button>
      </div>
    </header>

    <div class="toolbar">
      <div class="toolbar-inner">
        <span id="item-count">0 items</span>
        <input type="text" id="search-input" placeholder="⌕ Search..." />
      </div>
    </div>

    <div class="container" id="item-container">
      <div class="empty-state">
        <span>◇</span>
        <p>No items loaded</p>
      </div>
    </div>

    <div class="btns">
      <button id="addField"><span>＋ Add new item</span></button>
      <button id="cancelChanges"><span>↺ Revert Changes</span></button>
      <button id="reloadApi"><span>⟳ Reload from API</span></button>
      <button id="updateApi"><span>↑ Push to API</span></button>
    </div>
  </div>

  <!-- LOADING OVERLAY -->
  <div id="loading-overlay" class="hidden">
    <div class="spinner"></div>
    <p>Loading...</p>
  </div>

  <!-- CONFIRM MODAL -->
  <div id="confirm-modal" class="modal hidden">
    <div class="modal-box">
      <p id="confirm-message">Are you sure?</p>
      <div class="modal-btns">
        <button id="confirm-yes">Confirm</button>
        <button id="confirm-no">Cancel</button>
      </div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="toast"></div>

</body>
</html>
